name: Station patch checks
on:
  workflow_dispatch:
  push:
    branches: ["station/2.5.1"]
  pull_request:
    branches: ["station/2.5.1"]
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: sudo apt-get update && sudo apt-get install -y g++ pkg-config libswscale-dev
      - name: Cache ownership and box-reduction regressions
        run: |
          g++ -std=c++17 -O2 -pthread -Isrc/accelerator/ogl/util tests/station/test-idle-cache.cpp -o /tmp/test-idle-cache
          /tmp/test-idle-cache
          g++ -std=c++17 -O2 -Isrc/modules/newtek/consumer tests/station/test-ndi-box3.cpp $(pkg-config --cflags --libs libswscale) -o /tmp/test-ndi-box3
          /tmp/test-ndi-box3
  linux-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev libboost-coroutine-dev libboost-date-time-dev libboost-dev libboost-filesystem-dev libboost-locale-dev libboost-log-dev libboost-regex-dev libboost-system-dev libboost-thread-dev libicu-dev libglew-dev libjpeg-dev libopenal-dev libsfml-dev libsimde-dev libswresample-dev libswscale-dev libtbb-dev libxrandr-dev libegl1-mesa-dev zlib1g-dev fonts-liberation
          curl --fail --location --retry 3 -o /tmp/cef.deb 'https://github.com/CasparCG/server/releases/download/v2.5.1-stable/casparcg-cef-142_142.0.17.g60aac24%2B2-noble1_amd64.deb'
          echo '052cdd35dfdadc28aeee7deb34f3adabda87674269e2b84dcb44a40f0e9c3d52  /tmp/cef.deb' | sha256sum -c -
          sudo apt-get install -y /tmp/cef.deb
      - name: Compile patched engine with checksum-verified CEF SDK
        run: |
          cmake -GNinja -S src -B /tmp/station-build -DUSE_SYSTEM_CEF=OFF -DUSE_STATIC_BOOST=OFF -DCMAKE_BUILD_TYPE=Release -DDIAG_FONT_PATH=/usr/share/fonts/truetype/liberation/LiberationMono-Regular.ttf
          cmake --build /tmp/station-build --parallel 2
